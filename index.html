<!DOCTYPE html>

    <!--This script fixes an 404 error caused by using the browser router on github pages
      an alternative solution would be to use hash router instead of browser router but 
      hash router is not recommended. I feel this script is a better solution so I don't have to use hash router.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <script type="module" crossorigin src="/portfolio/assets/index-DKGVOAGm.js"></script>

  </head>
